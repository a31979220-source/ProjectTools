name: Build and Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装项目依赖
        run: npm ci

      - name: 构建前端、NSIS 安装包及绿色免安装版 ZIP
        run: |
          npm run pack:setup
          npm run pack:exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包绿色免安装版 ZIP
        shell: pwsh
        run: Compress-Archive -Path 'release/ProjectTools-win32-x64/*' -DestinationPath "release/ProjectTools-Portable-${{ github.ref_name }}.zip" -Force

      - name: 自动发布 GitHub Release 并上传安装包与绿色版附件
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ProjectTools-Setup-*.exe
            release/ProjectTools-Portable-*.zip
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
