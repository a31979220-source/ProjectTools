name: Build and Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装项目依赖
        run: npm ci

      - name: 构建前端与生成 EXE 安装包
        run: npm run pack:setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 自动发布 GitHub Release 并上传安装包附件
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ProjectTools-Setup-*.exe
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
